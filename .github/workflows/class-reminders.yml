name: Class reminders (the day before)

on:
  schedule:
    # every day 15:00 UTC = 18:00 Ethiopia time: tells students about tomorrow's class
    - cron: "0 15 * * *"
  workflow_dispatch: {}

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Call the backend trigger
        run: |
          curl --fail --silent --show-error --max-time 300 -X POST \
            -H "X-Cron-Token: ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.BACKEND_URL }}/api/notifications/cron/class-reminders/"
