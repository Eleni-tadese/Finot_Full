name: Weekly donation reminder

on:
  schedule:
    # Thursday 06:00 UTC = 09:00 Ethiopia time
    - cron: "0 6 * * 4"
  workflow_dispatch: {}

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Call the backend trigger
        run: |
          curl --fail --silent --show-error --max-time 300 -X POST \
            -H "X-Cron-Token: ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.BACKEND_URL }}/api/notifications/cron/weekly-reminders/"
